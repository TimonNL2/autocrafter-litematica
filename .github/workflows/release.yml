name: Publish version
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Check tag matches project version
        shell: bash
        run: |
          version=$(sed -n 's/^version=//p' gradle.properties | tr -d '\r')
          test "$GITHUB_REF_NAME" = "v$version"
          test -f "docs/releases/$version.md"
      - name: Build and test
        run: bash ./gradlew build --no-daemon
      - name: Create checksums
        working-directory: build/libs
        run: sha256sum *.jar > SHA256SUMS.txt
      - name: Publish downloadable release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          flags=()
          if [[ "$version" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" build/libs/*.jar build/libs/SHA256SUMS.txt \
            --verify-tag --title "Autocrafter Litematica $version (Minecraft 26.3)" \
            --notes-file "docs/releases/$version.md" "${flags[@]}"
