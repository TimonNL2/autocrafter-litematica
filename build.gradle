plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}
loom {
    splitEnvironmentSourceSets()
    mods {
        autocrafter_litematica {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}
repositories {
    mavenCentral()
    ivy {
        url = 'https://github.com/cabaletta/baritone/releases/download'
        patternLayout { artifact 'v[revision]/[artifact]-[revision].[ext]' }
        metadataSources { artifact() }
        content { includeModule('baritone', 'baritone-api-fabric') }
    }
}
dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    implementation 'baritone:baritone-api-fabric:1.20.0'
    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}
java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}
jar { from('LICENSE') }
tasks.withType(JavaCompile).configureEach { options.release = 25 }
test { useJUnitPlatform() }
fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'autocrafter-workshop-test'
        enableGameTests = false
        enableClientGameTests = true
    }
}
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
